services:
  pybossa-server:
    networks:
      - postgres
    env_file:
      - ./config/env/.env.dev

  pybossa-worker:
    networks:
      - postgres
    env_file:
      - ./config/env/.env.dev

  pybossa-scheduler:
    networks:
      - postgres
    env_file:
      - ./config/env/.env.dev
  
  webserver:
    env_file:
      - ./config/env/.env.dev
    networks:
      - web

networks:
  web:
    name: pybossa-web-network
  postgres:
    name: pybossa-postgres-network
    external: true
  
  